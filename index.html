<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Ulam</title>
    <script src="js/javascript.js"></script>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="style/style.css">
    <link rel="icon" href="images/icon-no-background.png">
</head>
<body>
    <div class="container">
        <img src="images/icon-no-background.png" alt="icon" class="icon">
        <h2><b>Bhabe ano ulam?</b></h2>
        <div class="panel">
            <div class="chosen-dish">
                <p>TAP BUTTON TO PICK</p>
                <h3>Ready to Choose!</h3>
            </div>
            
            <br>

            <a class="choose-dish">Pick Random Dish</a>
        </div>

        <br>

        <div class="panel p-1">
            <div class="add-container">
                <input type="text" name="dish" placeholder="Dito mo type ung ulam">
                <a class="add-dish">Add</a>
            </div>
        </div>

        <br>

        <div class="history-title">
            <span><b>YOUR DISH LIST(<span class="total-dishes">0</span>)</b></span>
            <a class="clear-dish">Clear All</a>
        </div>

        <div class="dish-list">
            <div class="panel dish-item">
                <div class="dish-name">Pizza</div>

                <div class="dish-button">
                    <a class="dish-edit">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </a>
                    <a class="dish-delete">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                            <path d="M10 11v6M14 11v6"/>
                            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
